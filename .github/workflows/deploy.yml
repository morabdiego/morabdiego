name: Deploy Static Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Para https://<user>.github.io/<repo> usa "/<repo>". Si usás dominio propio, dejalo vacío "".
      REFLEX_FRONTEND_PATH: "/${{ github.event.repository.name }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Export Reflex static frontend
        run: |
          uv run reflex export --frontend-only --no-zip
          # Reflex ubica el build dentro de .web/build/client/<frontend_path> cuando REFLEX_FRONTEND_PATH está definido.
          # Para GitHub Pages (que ya sirve en /<repo>/), subimos el contenido de esa subcarpeta como raíz del artefacto.
          if [ -n "$REFLEX_FRONTEND_PATH" ] && [ -d ".web/build/client${REFLEX_FRONTEND_PATH}" ]; then
            mkdir -p dist
            cp -r .web/build/client${REFLEX_FRONTEND_PATH}/* dist/
          else
            mkdir -p dist
            cp -r .web/build/client/* dist/
          fi
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
